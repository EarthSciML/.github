name: Update contributors image

on:
  schedule:
    - cron: "0 0 * * 0"  # every Sunday at midnight
  workflow_dispatch:     # allow manual trigger
  push:
    branches: [main]
    paths:
      - .github/scripts/generate_contributors.py
      - .github/workflows/update_contributors.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow committing changes
      actions: write   # allow re-enabling this workflow (see the last step)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate contributors SVG
        env:
          GITHUB_ORG: EarthSciML
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_contributors.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributors.svg
          git commit -m "Update contributors SVG" || echo "No changes to commit"
          git push

      # GitHub disables a scheduled workflow after 60 days without a commit to
      # the repository, which is how this one stopped in October 2025: this
      # repository rarely changes, and a week with no new contributors commits
      # nothing. Re-enabling it through the API resets that 60-day clock.
      - name: Keep this schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update_contributors.yml/enable"
