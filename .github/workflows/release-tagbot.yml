name: "Reusable Release - TagBot"

# Release step 2 (see RELEASING.md in this repository). When General merges a
# registration, the JuliaTagBot account comments on an issue in the caller's
# repository; TagBot then tags the registered commit `v<version>` and creates
# the GitHub release from the registration's release notes.
#
# The caller should only call this when
#   github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
# and pass `secrets: inherit`.
#
# GitHub starts no workflow from a tag GITHUB_TOKEN creates, and that tag is
# what runs the caller's release.yml, so TagBot needs another credential:
#
#   * The org's TagBot GitHub App (preferred): org variable
#     TAGBOT_APP_CLIENT_ID and org secret TAGBOT_APP_PRIVATE_KEY. One App
#     serves every repository it is installed on, and each run mints a token
#     for the calling repository only.
#   * Otherwise a per-repository deploy key, TAGBOT_SSH_KEY, which is how
#     repositories were set up before the App.

on:
  workflow_call:
    inputs:
      julia-subdir:
        description: "Directory holding the Julia package's Project.toml, relative to the repository root"
        default: "."
        required: false
        type: string
    secrets:
      TAGBOT_APP_PRIVATE_KEY:
        description: "Private key of the org's TagBot GitHub App; its client ID is the org variable TAGBOT_APP_CLIENT_ID"
        required: false
      TAGBOT_SSH_KEY:
        description: "Fallback when the App is not configured: private half of a deploy key with write access"
        required: false

jobs:
  TagBot:
    # TagBot is a container action, which ubuntu-slim cannot run.
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.TAGBOT_APP_PRIVATE_KEY != '' && vars.TAGBOT_APP_CLIENT_ID != '' }}
      HAS_SSH: ${{ secrets.TAGBOT_SSH_KEY != '' }}
    steps:
      # Without either, TagBot would tag with GITHUB_TOKEN and release.yml
      # would silently never run.
      - name: Check for a credential that starts release.yml
        if: env.HAS_APP != 'true' && env.HAS_SSH != 'true'
        run: |
          echo "::error::Neither the TagBot App (TAGBOT_APP_CLIENT_ID variable + TAGBOT_APP_PRIVATE_KEY secret) nor a TAGBOT_SSH_KEY secret is available to this repository. See EarthSciML/.github RELEASING.md."
          exit 1

      - name: Mint a token for this repository
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAGBOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAGBOT_APP_PRIVATE_KEY }}
          # TagBot reads issues and merged PRs for the changelog and opens an
          # issue when it cannot tag. `workflows` lets it tag a commit that
          # edits a workflow file, which GitHub otherwise refuses.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: read
          permission-workflows: write

      - uses: JuliaRegistries/TagBot@ffef3282bcacf1055e4d621a5c010959dfbe59ff # v1.25.13
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Only when there is no App token: the deploy key pushes the tag.
          ssh: ${{ env.HAS_APP != 'true' && secrets.TAGBOT_SSH_KEY || '' }}
          subdir: ${{ inputs.julia-subdir != '.' && inputs.julia-subdir || '' }}
          # A subdirectory package is tagged `<Package>-v<version>` by default.
          # Every other binding, the Go module tag, release.yml's trigger and
          # the installer's download URLs all expect `v<version>`.
          tag_prefix: NO_PREFIX
